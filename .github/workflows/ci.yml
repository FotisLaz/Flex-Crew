name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test
        run: ./mvnw -B test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: flexcrew
      POSTGRES_USER: flexcrew
    steps:
      - uses: actions/checkout@v5
      - name: Generate throwaway secrets
        run: |
          for name in POSTGRES_PASSWORD SECRET_KEY; do
            value=$(openssl rand -base64 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Register and log in through the frontend
        run: |
          curl -fsS http://localhost:5173/ -o /dev/null
          curl -fsS http://localhost:5173/api/auth/register -o /dev/null \
            -H 'Content-Type: application/json' \
            -d '{"names":"CI","firstSurname":"Smoke","secondSurname":"Test","email":"ci@example.com","password":"Passw0rd!"}'
          curl -fsS http://localhost:5173/api/auth/authenticate -o /dev/null \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"Passw0rd!"}'
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
